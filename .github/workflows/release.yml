name: Montar zips do material

# Roda quando uma tag material-vN é criada, monta um zip por protótipo
# e anexa na release. O aluno baixa sempre da última release, então corrigir
# um protótipo é criar uma tag, nunca editar um link em oito aulas.

on:
  push:
    tags: ['material-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/montar-zips.mjs
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-zips/*.zip
          generate_release_notes: true
